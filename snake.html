<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Nexora Games - Snake</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #123b26,
            #06110a 55%,
            #020604
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    justify-content: center;

    padding: 15px;
}

.game {
    width: min(100%, 650px);

    text-align: center;
}

.topbar {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 12px;
}

.home-btn {
    width: 48px;
    height: 48px;

    border-radius: 13px;

    border:
        1px solid #385c43;

    background:
        rgba(255,255,255,0.07);

    color: white;

    cursor: pointer;

    font-size: 22px;
}

.title {
    margin: 0;

    font-size:
        clamp(28px, 7vw, 44px);

    letter-spacing: 2px;
}

.restart-btn {
    width: 48px;
    height: 48px;

    border-radius: 13px;

    border: 0;

    background:
        linear-gradient(
            135deg,
            #2f9b51,
            #16662e
        );

    color: white;

    cursor: pointer;

    font-size: 22px;
}

.score-row {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 9px;

    margin-bottom: 10px;
}

.score-box {
    padding: 9px;

    border-radius: 13px;

    background:
        rgba(255,255,255,0.06);

    border:
        1px solid rgba(255,255,255,0.10);
}

.score-box small {
    display: block;

    color: #91a69a;

    font-size: 10px;

    letter-spacing: 1px;
}

.score-box strong {
    font-size: 18px;
}

.settings {
    margin-bottom: 10px;
}

select {
    background: #132218;

    color: white;

    border:
        1px solid #42654b;

    border-radius: 9px;

    padding: 8px 12px;

    font-size: 14px;
}


/* BOARD */

.board-wrap {
    display: flex;

    justify-content: center;

    width: 100%;
}

canvas {
    display: block;

    width: min(94vw, 520px);
    height: min(94vw, 520px);

    max-width: 520px;
    max-height: 520px;

    aspect-ratio: 1;

    background:
        #07110b;

    border:
        4px solid #3e8051;

    border-radius: 20px;

    box-shadow:
        0 0 35px rgba(50,255,110,0.12);

    touch-action: none;
}


/* CONTROLLER */

.controller {
    width:
        min(94vw, 360px);

    margin:
        12px auto 0;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;
}

.arrow {
    aspect-ratio: 1;

    min-width: 62px;

    border-radius: 18px;

    border:
        2px solid #477454;

    background:
        linear-gradient(
            145deg,
            #21472d,
            #0d1e12
        );

    color: white;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 5px 0 #061008;

    touch-action: manipulation;

    -webkit-tap-highlight-color:
        transparent;
}

.arrow svg {
    width: 35px;
    height: 35px;

    fill: none;

    stroke: currentColor;

    stroke-width: 3.5;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.arrow:active {
    transform: translateY(4px);

    box-shadow:
        0 1px 0 #061008;
}

.blank {
    visibility: hidden;
}

.message {
    min-height: 22px;

    margin-top: 9px;

    color: #9eb4a4;

    font-size: 13px;
}


/* SMALL HEIGHT DEVICES */

@media (max-height: 700px) {

    body {
        padding-top: 5px;
    }

    .title {
        font-size: 27px;
    }

    .home-btn,
    .restart-btn {
        width: 40px;
        height: 40px;
    }

    .score-row {
        margin-bottom: 5px;
    }

    canvas {
        width: min(75vw, 420px);
        height: min(75vw, 420px);
    }

    .controller {
        margin-top: 6px;

        width:
            min(75vw, 300px);

        gap: 5px;
    }

    .arrow {
        min-width: 50px;
        border-radius: 13px;
    }

    .arrow svg {
        width: 28px;
        height: 28px;
    }
}

</style>
</head>


<body>


<div class="game">


    <div class="topbar">

        <button
            class="home-btn"
            id="homeBtn"
            aria-label="Home"
        >

            <svg
                viewBox="0 0 24 24"
                width="25"
                height="25"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M3 11.5 12 4l9 7.5"/>
                <path d="M5 10.5V20h14v-9.5"/>
                <path d="M9 20v-5h6v5"/>
            </svg>

        </button>


        <h1 class="title">

            <img
                src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f40d.svg"
                alt="Snake"
                width="35"
                height="35"
                style="vertical-align:-6px"
            >

            SNAKE

        </h1>


        <button
            class="restart-btn"
            id="restartBtn"
            aria-label="Restart"
        >

            <svg
                viewBox="0 0 24 24"
                width="25"
                height="25"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M20 11a8 8 0 0 0-14-5"/>
                <path d="M6 3v4h4"/>
                <path d="M4 13a8 8 0 0 0 14 5"/>
                <path d="M18 21v-4h-4"/>
            </svg>

        </button>

    </div>


    <div class="score-row">

        <div class="score-box">

            <small>PLAYER</small>

            <strong id="playerName">
                Guest
            </strong>

        </div>

        <div class="score-box">

            <small>SCORE</small>

            <strong id="score">
                0
            </strong>

        </div>

        <div class="score-box">

            <small>BEST</small>

            <strong id="highScore">
                0
            </strong>

        </div>

    </div>


    <div class="settings">

        <select id="difficulty">

            <option value="easy">
                Easy
            </option>

            <option
                value="medium"
                selected
            >
                Medium
            </option>

            <option value="hard">
                Hard
            </option>

        </select>

    </div>


    <div class="board-wrap">

        <canvas
            id="gameCanvas"
            width="500"
            height="500"
        ></canvas>

    </div>


    <!-- PROPER GAME ARROW PAD -->

    <div class="controller">

        <button
            class="arrow blank"
            aria-hidden="true"
        ></button>


        <button
            class="arrow"
            id="up"
            aria-label="Move up"
        >

            <svg viewBox="0 0 24 24">
                <path d="M12 19V5"/>
                <path d="m6 11 6-6 6 6"/>
            </svg>

        </button>


        <button
            class="arrow blank"
            aria-hidden="true"
        ></button>


        <button
            class="arrow"
            id="left"
            aria-label="Move left"
        >

            <svg viewBox="0 0 24 24">
                <path d="M19 12H5"/>
                <path d="m11 6-6 6 6 6"/>
            </svg>

        </button>


        <button
            class="arrow"
            id="down"
            aria-label="Move down"
        >

            <svg viewBox="0 0 24 24">
                <path d="M12 5v14"/>
                <path d="m18 13-6 6-6-6"/>
            </svg>

        </button>


        <button
            class="arrow"
            id="right"
            aria-label="Move right"
        >

            <svg viewBox="0 0 24 24">
                <path d="M5 12h14"/>
                <path d="m13 6 6 6-6 6"/>
            </svg>

        </button>

    </div>


    <div
        class="message"
        id="message"
    >
        Use the arrow buttons or keyboard.
    </div>

</div>


<script>

/* ================= PLAYER ================= */

const player =
    localStorage.getItem(
        "nexoraPlayer"
    ) || "Guest";

document.getElementById(
    "playerName"
).textContent = player;


function playerKey(name) {

    return encodeURIComponent(
        name.trim().toLowerCase()
    );
}


/* ================= CANVAS ================= */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


/* ================= GAME ================= */

const GRID = 25;

let snake;
let food;

let direction;
let nextDirection;

let score = 0;

let timer = null;

let running = false;
let ended = false;


const speed = {

    easy: 170,

    medium: 115,

    hard: 72
};


const difficulty =
    document.getElementById(
        "difficulty"
    );


function scoreKey() {

    return (
        "nexoraSnakeHighScore_" +
        playerKey(player) +
        "_" +
        difficulty.value
    );
}


function highScore() {

    return Number(
        localStorage.getItem(
            scoreKey()
        ) || 0
    );
}


function showHighScore() {

    document.getElementById(
        "highScore"
    ).textContent =
        highScore();
}


/* ================= SOUND ================= */

let audio = null;


function beep(
    frequency,
    duration
) {

    try {

        if (!audio) {

            audio =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }

        if (
            audio.state ===
            "suspended"
        ) {
            audio.resume();
        }

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.frequency.value =
            frequency;

        oscillator.type =
            "square";

        gain.gain.setValueAtTime(
            0.04,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime +
            duration
        );

        oscillator.connect(gain);
        gain.connect(audio.destination);

        oscillator.start();

        oscillator.stop(
            audio.currentTime +
            duration
        );

    } catch {}
}


/* ================= FOOD ================= */

function makeFood() {

    do {

        food = {

            x:
                Math.floor(
                    Math.random() *
                    GRID
                ),

            y:
                Math.floor(
                    Math.random() *
                    GRID
                )
        };

    } while (
        snake.some(
            part =>
                part.x === food.x &&
                part.y === food.y
        )
    );
}


/* ================= START ================= */

function startGame() {

    clearInterval(timer);

    snake = [

        {
            x: 12,
            y: 12
        },

        {
            x: 11,
            y: 12
        },

        {
            x: 10,
            y: 12
        }

    ];


    direction = {
        x: 1,
        y: 0
    };


    nextDirection = {
        x: 1,
        y: 0
    };


    score = 0;

    running = true;
    ended = false;

    document.getElementById(
        "score"
    ).textContent = "0";


    document.getElementById(
        "message"
    ).textContent =
        "Use the arrow buttons or keyboard.";


    makeFood();

    timer =
        setInterval(
            update,
            speed[difficulty.value]
        );

    draw();
}


/* ================= DIRECTION ================= */

function setDirection(x, y) {

    if (!running) {
        return;
    }


    if (
        x === -direction.x &&
        y === -direction.y
    ) {
        return;
    }


    nextDirection = {
        x,
        y
    };
}


/* ================= UPDATE ================= */

function update() {

    direction = nextDirection;


    const head = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y
    };


    if (
        head.x < 0 ||
        head.x >= GRID ||
        head.y < 0 ||
        head.y >= GRID
    ) {

        finish();

        return;
    }


    const collision =
        snake.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        );


    if (collision) {

        finish();

        return;
    }


    snake.unshift(head);


    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score += 10;

        document.getElementById(
            "score"
        ).textContent =
            score;

        if (
            score > highScore()
        ) {

            localStorage.setItem(
                scoreKey(),
                score
            );

            showHighScore();
        }

        beep(700, 0.08);

        makeFood();

    } else {

        snake.pop();
    }


    draw();
}


/* ================= END ================= */

function finish() {

    clearInterval(timer);

    running = false;
    ended = true;

    beep(130, 0.25);

    document.getElementById(
        "message"
    ).textContent =
        "Game over. Press restart to play again.";

    draw();
}


/* ================= DRAW ================= */

function draw() {

    const cell =
        canvas.width / GRID;


    ctx.fillStyle =
        "#07110b";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle =
        "rgba(255,255,255,0.035)";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i <= GRID;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i * cell,
            0
        );

        ctx.lineTo(
            i * cell,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i * cell
        );

        ctx.lineTo(
            canvas.width,
            i * cell
        );

        ctx.stroke();
    }


    /* FOOD */

    const fx =
        food.x * cell +
        cell / 2;

    const fy =
        food.y * cell +
        cell / 2;


    const gradient =
        ctx.createRadialGradient(
            fx - 4,
            fy - 4,
            2,
            fx,
            fy,
            cell * 0.42
        );

    gradient.addColorStop(
        0,
        "#ff8585"
    );

    gradient.addColorStop(
        1,
        "#e72c3d"
    );

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        fx,
        fy,
        cell * 0.34,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* SNAKE */

    snake.forEach(
        (part, index) => {

            const padding =
                cell * 0.07;

            const x =
                part.x * cell +
                padding;

            const y =
                part.y * cell +
                padding;

            const size =
                cell -
                padding * 2;


            ctx.fillStyle =
                index === 0
                ? "#75ef78"
                : "#35b950";


            ctx.beginPath();

            ctx.roundRect(
                x,
                y,
                size,
                size,
                cell * 0.18
            );

            ctx.fill();
        }
    );


    /* EYES */

    const head =
        snake[0];

    const cx =
        head.x * cell +
        cell / 2;

    const cy =
        head.y * cell +
        cell / 2;


    let eyes = [];


    if (direction.x > 0) {

        eyes = [
            [cx + 5, cy - 5],
            [cx + 5, cy + 5]
        ];

    } else if (direction.x < 0) {

        eyes = [
            [cx - 5, cy - 5],
            [cx - 5, cy + 5]
        ];

    } else if (direction.y < 0) {

        eyes = [
            [cx - 5, cy - 5],
            [cx + 5, cy - 5]
        ];

    } else {

        eyes = [
            [cx - 5, cy + 5],
            [cx + 5, cy + 5]
        ];
    }


    ctx.fillStyle = "#07110b";


    eyes.forEach(
        eye => {

            ctx.beginPath();

            ctx.arc(
                eye[0],
                eye[1],
                2.5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    );


    /* GAME OVER */

    if (ended) {

        ctx.fillStyle =
            "rgba(0,0,0,0.60)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.textAlign =
            "center";

        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 40px Arial";

        ctx.fillText(
            "GAME OVER",
            canvas.width / 2,
            canvas.height / 2
        );


        ctx.font =
            "18px Arial";

        ctx.fillText(
            "Press restart",
            canvas.width / 2,
            canvas.height / 2 + 35
        );
    }
}


/* ================= BUTTONS ================= */

document.getElementById(
    "up"
).addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        setDirection(0, -1);
    }
);


document.getElementById(
    "down"
).addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        setDirection(0, 1);
    }
);


document.getElementById(
    "left"
).addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        setDirection(-1, 0);
    }
);


document.getElementById(
    "right"
).addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        setDirection(1, 0);
    }
);


/* ================= KEYBOARD ================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowUp"
        ) {
            setDirection(0, -1);
        }

        else if (
            event.key ===
            "ArrowDown"
        ) {
            setDirection(0, 1);
        }

        else if (
            event.key ===
            "ArrowLeft"
        ) {
            setDirection(-1, 0);
        }

        else if (
            event.key ===
            "ArrowRight"
        ) {
            setDirection(1, 0);
        }

    }
);


/* ================= RESTART ================= */

document.getElementById(
    "restartBtn"
).addEventListener(
    "click",
    () => {

        beep(500, 0.06);

        startGame();
    }
);


/* ================= HOME ================= */

document.getElementById(
    "homeBtn"
).addEventListener(
    "click",
    () => {

        window.location.href =
            "index.html";
    }
);


/* ================= DIFFICULTY ================= */

difficulty.addEventListener(
    "change",
    () => {

        showHighScore();

        startGame();
    }
);


/* ================= START ================= */

showHighScore();

startGame();

</script>

</body>
</html>
